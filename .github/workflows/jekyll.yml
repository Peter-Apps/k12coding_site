name: Deploy site + JupyterLite to Pages
on:
  push:
    branches: ["master"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # --- Build the Jekyll site ---
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.319.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
        # Outputs to ./_site by default

      # --- Pull notebook content from adamlamee/CODINGinK12 ---
      - name: Checkout notebooks repo
        uses: actions/checkout@v4
        with:
          repository: adamlamee/CODINGinK12
          path: notebooks-content
          sparse-checkout: |
            notebooks
          sparse-checkout-cone-mode: false

      # --- Build JupyterLite into a subfolder of the same _site ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the dependencies from requirements.txt
        run: |
          python -m pip install -r requirements.txt

      - name: Install JupyterLite
        run: pip install jupyterlite-core jupyterlite-pyodide-kernel jupyterlite-pyodide-lock jupyter-server

      - name: Setup geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build JupyterLite
        run: |
          jupyter lite build \
            --contents notebooks-content/notebooks \
            --output-dir _site/jupyter \
            --base-url "${{ steps.pages.outputs.base_path }}/jupyter/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        # Uploads ./_site by default — now contains both Jekyll pages and jupyter/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
